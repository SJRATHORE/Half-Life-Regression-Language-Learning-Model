<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Farsi HLR{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;600;700&family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  <nav class="navbar">
    <a href="{{ url_for('dashboard') }}" class="nav-brand">
      <span class="brand-farsi">فارسی</span>
      <span class="brand-en">HLR</span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('study') }}"     class="nav-link {% if request.endpoint == 'study'     %}active{% endif %}">Study</a>
      <a href="{{ url_for('progress') }}"  class="nav-link {% if request.endpoint == 'progress'  %}active{% endif %}">Progress</a>
      <a href="{{ url_for('word_list') }}" class="nav-link {% if request.endpoint == 'word_list' %}active{% endif %}">Words</a>
    </div>
  </nav>

  <main class="main-content">
    {% if message is defined and message %}
      <div class="alert">{{ message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Farsi . Half-Life Regression . Rathore & Abbas &copy; IBA, 2026. All rights reserved.</p>
  </footer>
  
  {% block scripts %}{% endblock %}
</body>
</html>
